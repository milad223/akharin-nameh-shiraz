name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract project ZIP
        run: |
          unzip -q akharin_nameh_shiraz_github_build.zip -d project
          echo "Project extracted"

      - name: Build APK 
  working-directory: project
  run: |
    wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
    unzip -q /tmp/gradle.zip -d /tmp
    export PATH="/tmp/gradle-8.9/bin:$PATH"
    gradle --no-daemon --stacktrace assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AkharinNamehShiraz-APK
          path: project/app/build/outputs/apk/debug/*.apk
