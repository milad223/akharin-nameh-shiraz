name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          rm -rf project
          mkdir project
          unzip -q akharin_nameh_shiraz_github_build.zip -d project

      - name: Find project root
        run: |
          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
          else
            ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -1 | xargs dirname)
            echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          fi

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Find APK
        run: |
          find "${{ env.PROJECT_DIR }}" -type f -name "*.apk" -print

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find "${{ env.PROJECT_DIR }}" -type f -name "*.apk" | head -1)
          gh release create "build-${{ github.run_number }}" "$APK" \
            --title "آخرین نامه از شیراز - APK ${{
              github.run_number
            }}" \
            --notes "نسخه آزمایشی برنامه آخرین نامه از شیراز"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AkharinNamehShiraz-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
